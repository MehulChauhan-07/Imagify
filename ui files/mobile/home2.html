<html>

<head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#101a23] dark justify-between group/design-root overflow-x-hidden"
        style='font-family: Manrope, "Noto Sans", sans-serif;'>
        <div>
            <div class="flex items-center bg-[#101a23] p-4 pb-2 justify-between">
                <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12">
                    Imagify</h2>
                <div class="flex w-12 items-center justify-end">
                    <button
                        class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 bg-transparent text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
                        <div class="text-white" data-icon="User" data-size="24px" data-weight="regular">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                                viewBox="0 0 256 256">
                                <path
                                    d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z">
                                </path>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
            <div class="@container">
                <div class="@[480px]:p-4">
                    <div class="flex min-h-[480px] flex-col gap-6 bg-cover bg-center bg-no-repeat @[480px]:gap-8 @[480px]:rounded-xl items-center justify-center p-4"
                        style='background-image: linear-gradient(rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuCwkHPNnj6KJsQCC9vhouUGMxn0lbolYTkVQmmpNpba-w3zvFb7sjoc832lwYax-IbcpbaQ0GEQKaLV_YfQ6WQ8zfRbv7T6N3OnpZv85mH4kyeyr6rIxbLnAAiZX4yF-8Nf9cVW74By8KuTLOPFPlrcvjsI9necVAHwT9PpBRFiDdPRUiOK-N3CP0ACfLcJ-0-Bs6gkPjmCvXfIMaWWZ7GNG4RwxuB4Xt3DRL4vnJb-h8WdM8TYkTBQflWe3O9ucYgbWGZTVKxcIw");'>
                        <div class="flex flex-col gap-2 text-center">
                            <h1
                                class="text-white text-4xl font-black leading-tight tracking-[-0.033em] @[480px]:text-5xl @[480px]:font-black @[480px]:leading-tight @[480px]:tracking-[-0.033em]">
                                Turn Words Into Art
                            </h1>
                            <h2
                                class="text-white text-sm font-normal leading-normal @[480px]:text-base @[480px]:font-normal @[480px]:leading-normal">
                                Create stunning images from text using AI
                            </h2>
                        </div>
                        <label class="flex flex-col min-w-40 h-14 w-full max-w-[480px] @[480px]:h-16">
                            <div class="flex w-full flex-1 items-stretch rounded-xl h-full">
                                <div class="text-[#90adcb] flex border border-[#314d68] bg-[#182634] items-center justify-center pl-[15px] rounded-l-xl border-r-0"
                                    data-icon="MagnifyingGlass" data-size="20px" data-weight="regular">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px"
                                        fill="currentColor" viewBox="0 0 256 256">
                                        <path
                                            d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z">
                                        </path>
                                    </svg>
                                </div>
                                <input placeholder="A majestic dragon soaring through purple clouds..."
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border border-[#314d68] bg-[#182634] focus:border-[#314d68] h-full placeholder:text-[#90adcb] px-[15px] rounded-r-none border-r-0 pr-2 rounded-l-none border-l-0 pl-2 text-sm font-normal leading-normal @[480px]:text-base @[480px]:font-normal @[480px]:leading-normal"
                                    value="" />
                                <div
                                    class="flex items-center justify-center rounded-r-xl border-l-0 border border-[#314d68] bg-[#182634] pr-[7px]">
                                    <button
                                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 @[480px]:h-12 @[480px]:px-5 bg-[#0d80f2] text-white text-sm font-bold leading-normal tracking-[0.015em] @[480px]:text-base @[480px]:font-bold @[480px]:leading-normal @[480px]:tracking-[0.015em]">
                                        <span class="truncate">Generate</span>
                                    </button>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            <p class="text-[#90adcb] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center">0/200</p>
            <div class="flex gap-3 p-3 flex-wrap pr-4">
                <div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-[#223649] pl-4 pr-4">
                    <p class="text-white text-sm font-medium leading-normal">Fantasy</p>
                </div>
                <div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-[#223649] pl-4 pr-4">
                    <p class="text-white text-sm font-medium leading-normal">Sci-Fi</p>
                </div>
                <div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-[#223649] pl-4 pr-4">
                    <p class="text-white text-sm font-medium leading-normal">Abstract</p>
                </div>
            </div>
            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">How It Works
            </h2>
            <div class="flex flex-col p-4 gap-3">
                <details class="flex flex-col rounded-xl bg-[#223649] px-4 py-2 group">
                    <summary class="flex cursor-pointer items-center justify-between gap-6 py-2">
                        <p class="text-white text-sm font-medium leading-normal">Describe your vision</p>
                        <div class="text-white group-open:rotate-180" data-icon="CaretDown" data-size="20px"
                            data-weight="regular">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor"
                                viewBox="0 0 256 256">
                                <path
                                    d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z">
                                </path>
                            </svg>
                        </div>
                    </summary>
                    <p class="text-[#90adcb] text-sm font-normal leading-normal pb-2"></p>
                </details>
                <details class="flex flex-col rounded-xl bg-[#223649] px-4 py-2 group">
                    <summary class="flex cursor-pointer items-center justify-between gap-6 py-2">
                        <p class="text-white text-sm font-medium leading-normal">Generate your image</p>
                        <div class="text-white group-open:rotate-180" data-icon="CaretDown" data-size="20px"
                            data-weight="regular">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor"
                                viewBox="0 0 256 256">
                                <path
                                    d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z">
                                </path>
                            </svg>
                        </div>
                    </summary>
                    <p class="text-[#90adcb] text-sm font-normal leading-normal pb-2"></p>
                </details>
            </div>
            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Recent
                Generations</h2>
            <div class="flex flex-col px-4 py-6">
                <div class="flex flex-col items-center gap-6">
                    <div class="bg-center bg-no-repeat aspect-video bg-cover rounded-xl w-full max-w-[360px]"
                        style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCoHfOuX9RZpohwW6GFifCOwJd7LNw4FHI1qoGfQVd_NKGjtcH7_cwkTDp3s5ep1L6OJTid7fMZsFEk5lsRLf3bG9n4NayIsGTPMxrEJa9CILOA_qvk6-ZlkcIRi2wO1_477wFjZZ36Jnm7xP8HKy20ynJ1-aqvKoPBoiiiKbYBF7WcrgPojmClqOq3DuO1RZEtq_cYai_YZDbmG6uM63ntvXV2PNZ9dN4MDIWY85odVg5h1KVAkr407GKfyAdreClKvwQV9D5fyg");'>
                    </div>
                    <div class="flex max-w-[480px] flex-col items-center gap-2">
                        <p
                            class="text-white text-lg font-bold leading-tight tracking-[-0.015em] max-w-[480px] text-center">
                            No Recent Generations Yet</p>
                        <p class="text-white text-sm font-normal leading-normal max-w-[480px] text-center">Your
                            generated images will appear here. Start creating now!</p>
                    </div>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                        <span class="truncate">Start Creating</span>
                    </button>
                </div>
            </div>
            <div class="flex px-4 py-3 justify-center">
                <button
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                    <span class="truncate">Try Demo Mode</span>
                </button>
            </div>
        </div>
        <div>
            <div class="flex gap-2 border-t border-[#223649] bg-[#182634] px-4 pb-3 pt-2">
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-white" href="#">
                    <div class="text-white flex h-8 items-center justify-center" data-icon="House" data-size="24px"
                        data-weight="fill">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0,1.14,1.14,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="MagnifyingGlass"
                        data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="PlusSquare"
                        data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32Zm0,176H48V48H208V208Zm-32-80a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="Heart" data-size="24px"
                        data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M178,32c-20.65,0-38.73,8.88-50,23.89C116.73,40.88,98.65,32,78,32A62.07,62.07,0,0,0,16,94c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,220.66,240,164,240,94A62.07,62.07,0,0,0,178,32ZM128,206.8C109.74,196.16,32,147.69,32,94A46.06,46.06,0,0,1,78,48c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,147.61,146.24,196.15,128,206.8Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="User" data-size="24px"
                        data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z">
                            </path>
                        </svg>
                    </div>
                </a>
            </div>
            <div class="h-5 bg-[#182634]"></div>
        </div>
    </div>
</body>

</html>
