<html>

<head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#101a23] dark justify-between group/design-root overflow-x-hidden"
        style='font-family: Manrope, "Noto Sans", sans-serif;'>
        <div>
            <div class="flex items-center bg-[#101a23] p-4 pb-2 justify-between">
                <div class="text-white flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px"
                    data-weight="regular">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                        viewBox="0 0 256 256">
                        <path
                            d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                        </path>
                    </svg>
                </div>
                <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Buy
                    Credits</h2>
                <div class="flex w-12 items-center justify-end">
                    <p class="text-[#90adcb] text-base font-bold leading-normal tracking-[0.015em] shrink-0">Credits: 10
                    </p>
                </div>
            </div>
            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Choose a plan
            </h2>
            <div class="grid grid-cols-[repeat(auto-fit,minmax(228px,1fr))] gap-2.5 px-4 py-3 @3xl:grid-cols-4">
                <div
                    class="flex flex-1 flex-col gap-4 rounded-xl border border-solid border-[#314d68] bg-[#182634] p-6">
                    <div class="flex flex-col gap-1">
                        <h1 class="text-white text-base font-bold leading-tight">Basic</h1>
                        <span class="text-white text-4xl font-black leading-tight tracking-[-0.033em]">₹799</span>
                    </div>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                        <span class="truncate">Purchase</span>
                    </button>
                    <div class="flex flex-col gap-2">
                        <div class="text-[13px] font-normal leading-normal flex gap-3 text-white">
                            <div class="text-white" data-icon="Check" data-size="20px" data-weight="regular">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor"
                                    viewBox="0 0 256 256">
                                    <path
                                        d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z">
                                    </path>
                                </svg>
                            </div>
                            100 Credits
                        </div>
                    </div>
                </div>
                <div
                    class="flex flex-1 flex-col gap-4 rounded-xl border border-solid border-[#314d68] bg-[#182634] p-6">
                    <div class="flex flex-col gap-1">
                        <h1 class="text-white text-base font-bold leading-tight">Standard</h1>
                        <span class="text-white text-4xl font-black leading-tight tracking-[-0.033em]">₹1599</span>
                    </div>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                        <span class="truncate">Purchase</span>
                    </button>
                    <div class="flex flex-col gap-2">
                        <div class="text-[13px] font-normal leading-normal flex gap-3 text-white">
                            <div class="text-white" data-icon="Check" data-size="20px" data-weight="regular">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor"
                                    viewBox="0 0 256 256">
                                    <path
                                        d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z">
                                    </path>
                                </svg>
                            </div>
                            250 Credits
                        </div>
                    </div>
                </div>
                <div
                    class="flex flex-1 flex-col gap-4 rounded-xl border border-solid border-[#314d68] bg-[#182634] p-6">
                    <div class="flex flex-col gap-1">
                        <h1 class="text-white text-base font-bold leading-tight">Premium</h1>
                        <span class="text-white text-4xl font-black leading-tight tracking-[-0.033em]">₹3999</span>
                    </div>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                        <span class="truncate">Purchase</span>
                    </button>
                    <div class="flex flex-col gap-2">
                        <div class="text-[13px] font-normal leading-normal flex gap-3 text-white">
                            <div class="text-white" data-icon="Check" data-size="20px" data-weight="regular">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor"
                                    viewBox="0 0 256 256">
                                    <path
                                        d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z">
                                    </path>
                                </svg>
                            </div>
                            750 Credits
                        </div>
                    </div>
                </div>
            </div>
            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Custom</h2>
            <div class="@container">
                <div
                    class="relative flex w-full flex-col items-start justify-between gap-3 p-4 @[480px]:flex-row @[480px]:items-center">
                    <div class="flex w-full shrink-[3] items-center justify-between">
                        <p class="text-white text-base font-medium leading-normal">Credits</p>
                        <p class="text-white text-sm font-normal leading-normal @[480px]:hidden">50</p>
                    </div>
                    <div class="flex h-4 w-full items-center gap-4">
                        <div class="flex h-1 flex-1 rounded-sm bg-[#314d68]">
                            <div class="h-full w-[32%] rounded-sm bg-[#0d80f2]"></div>
                            <div class="relative">
                                <div class="absolute -left-2 -top-1.5 size-4 rounded-full bg-[#0d80f2]"></div>
                            </div>
                        </div>
                        <p class="text-white text-sm font-normal leading-normal hidden @[480px]:block">50</p>
                    </div>
                </div>
            </div>
            <p class="text-[#90adcb] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center">Price: ₹399</p>
            <div class="flex px-4 py-3 justify-center">
                <button
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#0d80f2] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                    <span class="truncate">Purchase</span>
                </button>
            </div>
        </div>
        <div>
            <div class="flex gap-2 border-t border-[#223649] bg-[#182634] px-4 pb-3 pt-2">
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-white" href="#">
                    <div class="text-white flex h-8 items-center justify-center" data-icon="House" data-size="24px"
                        data-weight="fill">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0,1.14,1.14,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="MagnifyingGlass"
                        data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="PlusSquare"
                        data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32Zm0,176H48V48H208V208Zm-32-80a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="Heart" data-size="24px"
                        data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M178,32c-20.65,0-38.73,8.88-50,23.89C116.73,40.88,98.65,32,78,32A62.07,62.07,0,0,0,16,94c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,220.66,240,164,240,94A62.07,62.07,0,0,0,178,32ZM128,206.8C109.74,196.16,32,147.69,32,94A46.06,46.06,0,0,1,78,48c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,147.61,146.24,196.15,128,206.8Z">
                            </path>
                        </svg>
                    </div>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="User" data-size="24px"
                        data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z">
                            </path>
                        </svg>
                    </div>
                </a>
            </div>
            <div class="h-5 bg-[#182634]"></div>
        </div>
    </div>
</body>

</html>
