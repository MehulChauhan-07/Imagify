<html>

<head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#101a23] dark justify-between group/design-root overflow-x-hidden"
        style='font-family: Manrope, "Noto Sans", sans-serif;'>
        <div>
            <div class="flex items-center bg-[#101a23] p-4 pb-2 justify-between">
                <div class="text-white flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px"
                    data-weight="regular">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                        viewBox="0 0 256 256">
                        <path
                            d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                        </path>
                    </svg>
                </div>
                <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
                    Credits</h2>
            </div>
            <h2 class="text-white tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">You
                have 10 credits</h2>
            <p class="text-white text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">Imagify uses credits
                for image generation. Learn how to earn or purchase more.</p>
            <div class="flex px-4 py-3 justify-center">
                <button
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#0d80f2] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                    <span class="truncate">Learn More</span>
                </button>
            </div>
        </div>
        <div>
            <div class="flex gap-2 border-t border-[#223649] bg-[#182634] px-4 pb-3 pt-2">
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="House" data-size="24px"
                        data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V160h32v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H160V160a16,16,0,0,0-16-16H112a16,16,0,0,0-16,16v48H48V115.55l.11-.1L128,40l79.9,75.43.11.1Z">
                            </path>
                        </svg>
                    </div>
                    <p class="text-[#90adcb] text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="MagnifyingGlass"
                        data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z">
                            </path>
                        </svg>
                    </div>
                    <p class="text-[#90adcb] text-xs font-medium leading-normal tracking-[0.015em]">Explore</p>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#90adcb]" href="#">
                    <div class="text-[#90adcb] flex h-8 items-center justify-center" data-icon="PlusSquare"
                        data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32Zm0,176H48V48H208V208Zm-32-80a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z">
                            </path>
                        </svg>
                    </div>
                    <p class="text-[#90adcb] text-xs font-medium leading-normal tracking-[0.015em]">Create</p>
                </a>
                <a class="just flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-white" href="#">
                    <div class="text-white flex h-8 items-center justify-center" data-icon="User" data-size="24px"
                        data-weight="fill">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                            viewBox="0 0 256 256">
                            <path
                                d="M230.93,220a8,8,0,0,1-6.93,4H32a8,8,0,0,1-6.92-12c15.23-26.33,38.7-45.21,66.09-54.16a72,72,0,1,1,73.66,0c27.39,8.95,50.86,27.83,66.09,54.16A8,8,0,0,1,230.93,220Z">
                            </path>
                        </svg>
                    </div>
                    <p class="text-white text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
                </a>
            </div>
            <div class="h-5 bg-[#182634]"></div>
        </div>
    </div>
</body>

</html>
