<html>

<head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#101a23] dark group/design-root overflow-x-hidden"
        style='font-family: Inter, "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
            <header
                class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#223649] px-10 py-3">
                <div class="flex items-center gap-4 text-white">
                    <div class="size-4">
                        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M4 42.4379C4 42.4379 14.0962 36.0744 24 41.1692C35.0664 46.8624 44 42.2078 44 42.2078L44 7.01134C44 7.01134 35.068 11.6577 24.0031 5.96913C14.0971 0.876274 4 7.27094 4 7.27094L4 42.4379Z"
                                fill="currentColor"></path>
                        </svg>
                    </div>
                    <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Imagify</h2>
                </div>
                <div class="flex flex-1 justify-end gap-8">
                    <div class="flex items-center gap-9">
                        <a class="text-white text-sm font-medium leading-normal" href="#">Home</a>
                        <a class="text-white text-sm font-medium leading-normal" href="#">Generate</a>
                        <a class="text-white text-sm font-medium leading-normal" href="#">Explore</a>
                        <a class="text-white text-sm font-medium leading-normal" href="#">API</a>
                    </div>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                        <span class="truncate">Get credits</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                        style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBxRNaeX59iWO1wnmQDUyRZ7tdUpDudvcESJpCpvIvYudXgcLxuFk4PkClCzty-Xa5zGh8oGvuNspsI7_EVKC3WlJWzUOPpzkH0qQDkSuUnF-TwaiQnoBp_R3UBFnwU8ngkWFVVvr8zWaz2iRLlF-rWLHIePboWKYSPnFKE-ly6hPNDyMLiXK0_dLbznq4DF68iLypqG4u6PO9fjS2VrCwOtnG9PqDE5aE2z4zbXJ0jG9_jj9YqYbkF8KIT8vLD3jYPt7iX0YG05hEQ");'>
                    </div>
                </div>
            </header>
            <div class="px-40 flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
                    <div class="flex flex-wrap justify-between gap-3 p-4">
                        <p class="text-white tracking-light text-[32px] font-bold leading-tight min-w-72">Profile</p>
                    </div>
                    <h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">User Info
                    </h3>
                    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
                        <label class="flex flex-col min-w-40 flex-1">
                            <p class="text-white text-base font-medium leading-normal pb-2">Name</p>
                            <input
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border border-[#314d68] bg-[#182634] focus:border-[#314d68] h-14 placeholder:text-[#90adcb] p-[15px] text-base font-normal leading-normal"
                                value="" />
                        </label>
                    </div>
                    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
                        <label class="flex flex-col min-w-40 flex-1">
                            <p class="text-white text-base font-medium leading-normal pb-2">Email</p>
                            <input
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border border-[#314d68] bg-[#182634] focus:border-[#314d68] h-14 placeholder:text-[#90adcb] p-[15px] text-base font-normal leading-normal"
                                value="" />
                        </label>
                    </div>
                    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
                        <label class="flex flex-col min-w-40 flex-1">
                            <p class="text-white text-base font-medium leading-normal pb-2">Password</p>
                            <input
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border border-[#314d68] bg-[#182634] focus:border-[#314d68] h-14 placeholder:text-[#90adcb] p-[15px] text-base font-normal leading-normal"
                                value="" />
                        </label>
                    </div>
                    <div class="flex px-4 py-3 justify-start">
                        <button
                            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#0d80f2] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                            <span class="truncate">Update</span>
                        </button>
                    </div>
                    <h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Credits
                    </h3>
                    <p class="text-white text-base font-normal leading-normal pb-3 pt-1 px-4">You have 100 credits</p>
                    <div class="flex px-4 py-3 justify-start">
                        <button
                            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#223649] text-white text-sm font-bold leading-normal tracking-[0.015em]">
                            <span class="truncate">Get more credits</span>
                        </button>
                    </div>
                    <h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Billing
                    </h3>
                    <div class="px-4 py-3 @container">
                        <div class="flex overflow-hidden rounded-xl border border-[#314d68] bg-[#101a23]">
                            <table class="flex-1">
                                <thead>
                                    <tr class="bg-[#182634]">
                                        <th
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-120 px-4 py-3 text-left text-white w-[400px] text-sm font-medium leading-normal">
                                            Date</th>
                                        <th
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-240 px-4 py-3 text-left text-white w-[400px] text-sm font-medium leading-normal">
                                            Amount</th>
                                        <th
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-360 px-4 py-3 text-left text-white w-[400px] text-sm font-medium leading-normal">
                                            Credits</th>
                                        <th
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-480 px-4 py-3 text-left text-white w-60 text-sm font-medium leading-normal">
                                            Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-t border-t-[#314d68]">
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-120 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            05/15/2024
                                        </td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-240 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            $10.00</td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-360 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            1000</td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-480 h-[72px] px-4 py-2 w-60 text-sm font-normal leading-normal">
                                            <button
                                                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-8 px-4 bg-[#223649] text-white text-sm font-medium leading-normal w-full">
                                                <span class="truncate">Completed</span>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr class="border-t border-t-[#314d68]">
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-120 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            04/15/2024
                                        </td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-240 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            $10.00</td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-360 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            1000</td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-480 h-[72px] px-4 py-2 w-60 text-sm font-normal leading-normal">
                                            <button
                                                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-8 px-4 bg-[#223649] text-white text-sm font-medium leading-normal w-full">
                                                <span class="truncate">Completed</span>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr class="border-t border-t-[#314d68]">
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-120 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            03/15/2024
                                        </td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-240 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            $10.00</td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-360 h-[72px] px-4 py-2 w-[400px] text-[#90adcb] text-sm font-normal leading-normal">
                                            1000</td>
                                        <td
                                            class="table-d47c218b-616b-4022-bc20-853a77b6935c-column-480 h-[72px] px-4 py-2 w-60 text-sm font-normal leading-normal">
                                            <button
                                                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-8 px-4 bg-[#223649] text-white text-sm font-medium leading-normal w-full">
                                                <span class="truncate">Completed</span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <style>
                            @container(max-width:120px) {
                                .table-d47c218b-616b-4022-bc20-853a77b6935c-column-120 {
                                    display: none;
                                }
                            }

                            @container(max-width:240px) {
                                .table-d47c218b-616b-4022-bc20-853a77b6935c-column-240 {
                                    display: none;
                                }
                            }

                            @container(max-width:360px) {
                                .table-d47c218b-616b-4022-bc20-853a77b6935c-column-360 {
                                    display: none;
                                }
                            }

                            @container(max-width:480px) {
                                .table-d47c218b-616b-4022-bc20-853a77b6935c-column-480 {
                                    display: none;
                                }
                            }
                        </style>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
